  # ═════════════════════════════════════════════════════════════════════
  # 認證
  # ═════════════════════════════════════════════════════════════════════

  /auth/login:
    post:
      tags: [認證]
      operationId: login
      summary: 後台登入
      description: |
        單段驗證，沒有雙因素。次數限制**只以帳號計數**，是後台唯一的硬防線（預設 5 次失敗／15 分鐘
        → 鎖 15 分鐘，鎖定事件寄告警信）。reCAPTCHA v3 是補強；連不上 Google 時放行。
        失敗訊息不區分「帳號不存在」與「密碼錯誤」；帳號停用只在密碼驗證通過之後才揭露
        （403 `AUTH_ACCOUNT_INACTIVE`）。
      x-handler: AuthHandler.LoginAsync
      x-bot-check: { action: login }
      x-rate-limit: { bucket: login, scope: account, default: '5 次失敗 / 15 分鐘，鎖 15 分鐘（RateLimit:Login:*）' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/TokenOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 帳號或密碼錯誤（`AUTH_INVALID_CREDENTIALS`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/refresh:
    post:
      tags: [認證]
      operationId: refreshToken
      summary: 換發 token（refresh token 輪替）
      description: |
        舊 refresh token 立即撤銷並發新的一對。**偵測到已撤銷的 token 被重用 → 撤銷該使用者全部
        refresh token**（疑似外洩）。回應含完整 `permissions[]`，前端還原登入狀態時要一併更新權限。
      x-handler: AuthHandler.RefreshAsync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/TokenOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/logout:
    post:
      tags: [認證]
      operationId: logout
      summary: 登出（撤銷 refresh token）
      description: |
        需要 Bearer，**不需權限碼**。冪等：缺 body、token 不存在、已撤銷都回成功。
        只能撤銷自己的 refresh token（別人的回 403）。
      x-handler: AuthHandler.LogoutAsync
      x-permission: null
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/change-password:
    post:
      tags: [認證]
      operationId: changePassword
      summary: 改自己的密碼
      description: |
        需要 Bearer，**不需權限碼**（它改的是自己的密碼）。成功後撤銷該使用者**全部** refresh token，
        呼叫端自己也要重新登入。
        ⚠️ 本端點的新密碼長度下限是 **8**（`AuthHandler.MinPasswordLength`），
        與帳號管理建立／重設密碼的 6 不同（見交付回報的不一致清單）。
      x-handler: AuthHandler.ChangePasswordAsync
      x-permission: null
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 缺少／無效憑證，或「目前密碼不正確」（`AUTH_INVALID_CREDENTIALS`）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ═════════════════════════════════════════════════════════════════════
  # 後台：九個內容單元
  # ═════════════════════════════════════════════════════════════════════

  /admin/dashboard:
    get:
      tags: [後台・系統]
      operationId: getDashboard
      summary: 儀表板（九個單元 × 四態筆數）
      description: 登入即可。聚合查詢，無專屬資料表。`inReview` 保留是因為舊資料仍可能停在該狀態。
      x-handler: DashboardHandler.GetAsync
      x-permission: null
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 各單元筆數。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [contentCountsByUnit]
                        properties:
                          contentCountsByUnit:
                            type: object
                            description: 鍵是九個單元代號。
                            additionalProperties:
                              $ref: '#/components/schemas/ContentUnitCounts'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/{unit}:
    get:
      tags: [後台・內容單元]
      operationId: listContent
      summary: 內容清單（分頁）
      description: |
        登入即可（沒有獨立的 view 權限碼）。永遠回 `PagedResult`：`page`／`pageSize` 沒帶時用預設 1／20；
        `pageSize` 夾在 1–100。
        `termType` 只對 `term` 有效，值域外（非 1–4）當成「不篩」而不是 400。
      x-handler: ContentHandler.ListAsync
      x-permission: null
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          description: 1 草稿／2 送審中（舊資料）／3 已發布／4 已下架。
          schema: { type: integer, enum: [1, 2, 3, 4] }
        - name: categoryId
          in: query
          description: 分類 Term 的 id（有分類的單元：療程、文章、FAQ）。
          schema: { type: integer }
        - name: ownerUserId
          in: query
          schema: { type: integer }
        - name: termType
          in: query
          description: 只對 `term`：1 療程分類／2 文章分類／3 FAQ 分類／4 文章標籤。
          schema: { type: integer, enum: [1, 2, 3, 4] }
      responses:
        '200':
          description: 分頁清單。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PagedResult'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/ContentListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [後台・內容單元]
      operationId: createContent
      summary: 新增內容
      description: |
        新建一律是草稿，`sortOrder` 沒給就排在該單元最後。回傳新建後的完整詳情（HTTP 200）。
        型別專屬欄位可放巢狀 `fields`，也可攤在頂層（**帶了 `fields` 就只讀 `fields`**）。
        各單元必填：`title`、`slug`（小寫英數連字號）；`treatment`／`article`／`faq` 另需 `categoryTermId`；
        `term` 需 `termType`。`page` 不可新增系統頁（`pageKind = 2`）。

        逐單元的額外權限檢查（Handler 內，非 Router）：
        * `term`：新增分類（`termType` 1–3）需要 `taxonomy.category.manage`（限超級管理員）；
          新增標籤（`termType` 4）需要 `taxonomy.tag.create`。
        * `doctor`／`article`：醫師角色建立的內容 `ownerUserId` 一律歸自己。
      x-handler: ContentHandler.CreateAsync
      x-permission: 'content.{unit}.edit'
      x-owner-check: 醫師角色建立時 ownerUserId 強制為自己。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/ContentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/{unit}/sort:
    put:
      tags: [後台・內容單元]
      operationId: sortContent
      summary: 批次排序（當頁內重新分配）
      description: |
        送的是「當頁那幾筆原本佔住的排序值」的重新分配，不是整個單元的順序，也不是陣列索引（決策 21）。
        一次最多 100 筆；空陣列直接回成功。醫師角色只能調整自己負責的內容。
        `article` 單元前台不讀這個排序（只影響「某位醫師的文章」那一區）。
      x-handler: ContentHandler.SortAsync
      x-permission: 'content.{unit}.edit'
      x-owner-check: 醫師角色只能排序 OwnerUserId 是自己的內容。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items: { $ref: '#/components/schemas/SortItem' }
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/{unit}/{id}:
    get:
      tags: [後台・內容單元]
      operationId: getContent
      summary: 單筆內容詳情
      description: |
        登入即可。含 `fields`、`seo`、`relations`（**兩個方向都回**，靠 `isReverse` 分辨；
        反向的是唯讀，不可寫回 `PUT .../relations`）。`term` 的 `fields.usageCount` 為唯讀的引用筆數。
      x-handler: ContentHandler.GetAsync
      x-permission: null
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/ContentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [後台・內容單元]
      operationId: updateContent
      summary: 更新本文
      description: |
        整份替換語意：沒帶的純量欄位不動；明細列（圖庫、學經歷、看診時段…）有帶就整批取代。
        已發布的內容被編輯 → 工作副本回到草稿，但前台仍顯示已核准的那一版。
        換圖與移除圖片會把舊 blob 刪除。改 slug／分類造成網址變動時自動補一筆 301（`Source = SystemAuto`）。
        回傳更新後的完整詳情。

        附加檢查：
        * `Status = 送審中`（舊資料）本文鎖定 → 409 `CONFLICT_STATE`；按「發布」可救回。
        * 醫師角色只能動 `ownerUserId` 是自己的內容 → 403。
        * 法務頁（`page`，`superAdminOnly`）限超級管理員 → 403。
        * 系統鎖定（`isSystemLocked`）的內容不可改 slug。
        * `term` 非標籤的分類改 slug 需要 `taxonomy.category.manage`。
      x-handler: ContentHandler.UpdateAsync
      x-permission: 'content.{unit}.edit'
      x-owner-check: 醫師角色只能動 OwnerUserId 是自己的內容。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/ContentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [後台・內容單元]
      operationId: deleteContent
      summary: 刪除內容
      description: |
        * `isSystemLocked` → 409 `CONFLICT_LOCKED`。
        * `term`：需 `taxonomy.category.manage`／`taxonomy.tag.create`（依 `termType`），
          且仍被引用時 409 `CONFLICT_STATE`（訊息帶筆數）。
        * 指向它的關聯在同一交易內清掉；它獨佔的圖片 blob 一併刪除。
        * 外鍵違反一律轉成 409 `CONFLICT_STATE`。
      x-handler: ContentHandler.DeleteAsync
      x-permission: 'content.{unit}.edit'
      x-owner-check: 醫師角色只能刪 OwnerUserId 是自己的內容。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/OkNull' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/{unit}/{id}/seo:
    put:
      tags: [後台・內容單元]
      operationId: updateContentSeo
      summary: 只寫 SEO 區塊
      description: |
        行銷角色的落點：可改 SEO 欄位，不可改本文。`aiSummary` 有填時須 20–300 字；
        `seoTitle` ≤200、`metaDescription` ≤400。整份替換（沒帶的欄位會被清成 null／false）。
        回傳更新後的完整詳情。
      x-handler: ContentHandler.UpdateSeoAsync
      x-permission: seo.edit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeoSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/ContentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/{unit}/{id}/relations:
    put:
      tags: [後台・內容單元]
      operationId: updateContentRelations
      summary: 整筆取代正向關聯
      description: |
        會刪掉這筆內容**所有**正向關聯，再寫入送出的這一份——只改一個關聯欄位也要把其餘一起送，
        少送就是刪掉。`relationType` 必須適用於這個單元（例如 1–4 只給 `treatment`、12 只給 `page`）。
        反向關聯（`isReverse: true`）不可送回來。已發布者工作副本回草稿。
      x-handler: ContentHandler.UpdateRelationsAsync
      x-permission: 'content.{unit}.edit'
      x-owner-check: 醫師角色只能動 OwnerUserId 是自己的內容；法務頁限超級管理員。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/RelationSaveItem' }
      responses:
        '200': { $ref: '#/components/responses/ContentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
