# ═══════════════════════════════════════════════════════════════════════════
# 20SKIN API —— OpenAPI 3.1 規格（手寫，進版控）
# ═══════════════════════════════════════════════════════════════════════════
#
# 這份檔案是【手寫】的，不是產生出來的。
#
# 為什麼不能自動產生：
#   API 只有一個 Azure Function（functions/Functions/RouterFunction.cs），
#   Route = "{*route}" 的 catch-all，由 functions/Routing/AppRouter*.cs 用
#   (method, segments) 的 list pattern 自己分派。Swashbuckle／NSwag／Azure Functions
#   OpenAPI extension 這類產生器都靠「一支 Function ＝ 一條路由」內省，
#   在這個架構下只會看到一個 {*route}，看不到任何真正的端點。
#   （STATUS.md §五、docs/11-backend-design.md §2）
#
# 真實來源是程式碼，不是 docs/10-api.md：
#   路由表     functions/Routing/AppRouter.Public.cs（IsPublicRoute／RoutePublicAsync）
#              functions/Routing/AppRouter.Admin.cs （GetRequiredPermission／RouteAdminAsync）
#   信封       functions/Common/ApiResponse.cs
#   錯誤碼     functions/Common/ErrorCodes.cs
#   權限碼     functions/Common/Constants.cs（PermissionCodes）
#   形狀       functions/Models/Dtos/*.cs 與 functions/Handlers/*.cs
#   與 docs/10 不一致時以程式碼為準；已知的不一致見本檔最下方的交付回報（不在這裡重複）。
#
# 改了路由就要同步這份：
#   ① 新增／刪除／改名任何一條路由（IsPublicRoute、RoutePublicAsync、
#      GetRequiredPermission、RouteAdminAsync 四處之一）
#   ② 改了權限碼（GetRequiredPermission 的回傳值）→ 同步各操作的 x-permission
#   ③ 改了 request／response 形狀（Models/Dtos、Handler 內的匿名物件）
#   ④ 新增或改了錯誤碼（ErrorCodes.cs）→ 同步 components/schemas/ErrorCode
#   檢查指令：  npx --yes @redocly/cli lint docs/openapi.yaml
#
# 自訂擴充欄位（x-*）：
#   x-permission    後台端點：AppRouter.GetRequiredPermission 要求的權限碼。
#                   「登入即可」寫成 null 並在 description 註明。超級管理員一律通過。
#                   🔴 未登記於權限表的 /admin/* 一律 403（預設拒絕），所以這裡沒有的就是不存在。
#   x-bot-check     公開寫入端點需要 botCheckToken（reCAPTCHA v3，決策 15）；值是伺服器端比對的 action。
#   x-rate-limit    頻率限制：bucket（LoginThrottles 的鍵）與預設配額。可用 app setting 覆寫。
#   x-owner-check   Handler 內的資料列層級判定（醫師角色只能動 OwnerUserId 是自己的內容）。
#   x-handler       對應的 Handler 方法，方便從規格跳到程式。
#
# 其他慣例（對所有端點成立，不逐一重複）：
#   * 請求與回應一律 camelCase。
#   * 成功一律 HTTP 200（包含 POST 新增），沒有 201／204。
#   * 除了 /seo/* 的文字檔，所有回應都是統一信封（components/schemas/Envelope）。
#   * HEAD 當 GET 處理、OPTIONS 一律 200（CORS 預檢，allow-list 在平台層，由院方設定）；
#     兩者不逐一列出。
#   * 路由比對不分有無結尾斜線，且 /admin/{unit}/... 的 {unit} 只認九個代號。
#   * 已刪除、不得再寫進來的端點：POST /admin/{unit}/{id}/submit、/admin/review/*、
#     /api/fallback（決策 7、20）。
#   * 路徑模板在 Redocly 會有 no-ambiguous-paths 的警告（/admin/{unit}/sort 對
#     /admin/redirect/{id}）：實際上不衝突，因為 {unit} 只能是九個代號，而 redirect
#     不在其中；路由程式也是依序比對。這是 OpenAPI 路徑模板表達不了「列舉」造成的。

openapi: 3.1.0

info:
  title: 20SKIN API
  version: 1.0.0
  summary: 20SKIN 美醫集團網站（前台 SSR、後台 SPA、爬蟲）的唯一後端 API。
  description: |
    .NET 10 isolated Azure Functions（EF Core 寫入、Dapper 讀取），部署在 `api.20skin.tw`。
    前台每一個頁面請求都會打到公開端點；後台（`/admin/`）使用同一個 App。

    **認證**：公開端點匿名；`/admin/*`、`/auth/logout`、`/auth/change-password` 需要
    `Authorization: Bearer <accessToken>`（自簽 JWT，audience `20skin-admin`）。
    缺少或無效回 401 `AUTH_TOKEN_INVALID`；權限碼不足回 403 `FORBIDDEN`。

    **權限**：超級管理員（`is_superadmin` claim）自動通過所有權限檢查。
    其他角色看 JWT 的 `permissions` claim。共 28 個權限碼（見 `components/schemas/PermissionCode`）。

    **內容發布模型**：九個內容單元只有「草稿／已發布」兩態（決策 19），送審與審核者整層不做
    （決策 20）。公開端點讀的是**已核准版本快照**，不是工作副本。
  contact:
    name: 20SKIN 網站改版專案
  license:
    name: 私有專案
    identifier: LicenseRef-Proprietary

servers:
  - url: https://api.20skin.tw/api/v1
    description: 正式環境
  - url: http://localhost:7071/api/v1
    description: 本機（`cd functions && func start`）。換了位址，CORS allow-list 也要放行你的來源。

security: []

tags:
  - name: 健康檢查
  - name: 公開・內容
    description: 前台 SSR 每個頁面都會打的內容讀取端點。
  - name: 公開・表單與 AI
    description: 對公網開放的寫入端點，必須有機器人驗證與頻率限制。
  - name: 公開・SEO
    description: robots／sitemap／llms／faq.json。由 Nuxt server route 同源代理出去。
  - name: 認證
  - name: 後台・內容單元
    description: 九個內容單元共用同一組處理器。
  - name: 後台・站台編排
  - name: 後台・SEO 與 301
  - name: 後台・帳號與角色
  - name: 後台・系統

paths:
  # ═════════════════════════════════════════════════════════════════════
  # 公開端點（匿名）
  # ═════════════════════════════════════════════════════════════════════

  /health:
    get:
      tags: [健康檢查]
      operationId: getHealth
      summary: 冒煙測試
      description: >-
        兩條 workflow 的部署後 smoke test 都打它。刻意不檢查資料庫連線
        （冷啟動或暫時性延遲不該讓部署管線誤判全站掛掉）。
      x-handler: HealthHandler.GetAsync
      responses:
        '200':
          description: 服務存活。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          status:
                            type: string
                            const: healthy

  /{unit}:
    get:
      tags: [公開・內容]
      operationId: listPublicContent
      summary: 九個單元的公開列表
      description: |
        回傳的是**已核准版本快照**（形狀即前台的 `ContentRecord`），不另外定義公開 DTO。
        每一筆都帶 `indexable`（「內容夠不夠實在，值得被索引」，與 sitemap 同一個判斷，
        `Common/Indexability.cs`）。

        - `article`：**自動分頁**（預設每頁 12、上限 100），回 `{ items, page, pageSize, totalCount }`
          （注意：沒有 `totalPages`，與後台的 `PagedResult` 不同）。列表時 `fields.bodyBlocks` 為 null。
        - 其餘八個單元：回平面陣列，不分頁。
        - 非法的 `{unit}` 回 404。
        - `Cache-Control: public, max-age=300, stale-while-revalidate=60`。
      x-handler: PublicContentHandler.ListAsync
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - name: page
          in: query
          description: 只對 `article` 有效。
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          description: 只對 `article` 有效。預設 12，夾在 1–100。
          schema: { type: integer, minimum: 1, maximum: 100, default: 12 }
        - name: sort
          in: query
          description: 只認 `latest`（發布日期新到舊），其餘值一律退回預設排序（`article` 專用）。
          schema: { type: string, enum: [latest] }
        - name: categoryTermId
          in: query
          description: 文章分類（`article` 專用）。
          schema: { type: integer, minimum: 1 }
        - name: tagTermId
          in: query
          description: 文章標籤（`article` 專用）。
          schema: { type: integer, minimum: 1 }
        - name: authorDoctorId
          in: query
          description: 作者醫師（`article` 專用）。
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: |
            `article` 回 `PublicArticlePage`；其他單元回 `PublicContentRecord[]`。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/PublicArticlePage'
                          - type: array
                            items: { $ref: '#/components/schemas/PublicContentRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content:
    get:
      tags: [公開・內容]
      operationId: getPublicContentByPath
      summary: 依網址取單筆內容（含內文）
      description: |
        `path` 會被正規化成「前後都有斜線」。找不到回 404 `NOT_FOUND`。
        `Cache-Control: public, max-age=300, stale-while-revalidate=60`。
      x-handler: PublicContentHandler.GetByPathAsync
      parameters:
        - name: path
          in: query
          required: true
          description: 站內網址，例如 `/treatments/xxx/`。
          schema: { type: string }
      responses:
        '200':
          description: 該網址的已核准快照。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicContentRecord' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /content/batch:
    get:
      tags: [公開・內容]
      operationId: getPublicContentBatch
      summary: 依 id 批次取內容（上限 100）
      description: |
        給「關聯目標需要的欄位不只標題」用（例如療程卡片要關聯文章的封面與日期）。
        非數字或 ≤0 的 id 靜默略過，重複的去重，超過 100 個只取前 100。
        不存在或不可見的 id 不會出現在結果裡（不報錯）。
      x-handler: PublicContentHandler.BatchAsync
      parameters:
        - name: ids
          in: query
          required: true
          description: 以逗號分隔的內容 id，例如 `12,34,56`。
          schema: { type: string }
      responses:
        '200':
          description: 命中的快照陣列。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicContentRecord' }
        '500': { $ref: '#/components/responses/InternalError' }

  /article/popular-tags:
    get:
      tags: [公開・內容]
      operationId: getPopularTags
      summary: 熱門標籤（依實際引用篇數在 SQL 層聚合）
      description: '`Cache-Control: public, max-age=900`。'
      x-handler: PublicContentHandler.PopularTagsAsync
      parameters:
        - name: limit
          in: query
          description: 1–50，超出範圍或非數字一律用 12。
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
      responses:
        '200':
          description: 標籤清單。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [slug, title, articleCount]
                          properties:
                            slug: { type: string }
                            title: { type: string }
                            articleCount: { type: integer }
        '500': { $ref: '#/components/responses/InternalError' }

  /redirects/resolve:
    get:
      tags: [公開・內容]
      operationId: resolveRedirect
      summary: 舊網址解析（301 對照）
      description: |
        前台的 catch-all 路由（`pages/[...slug].vue`）查它。單筆 seek，只看 `IsActive = 1` 的規則。
        接受百分比編碼與未編碼兩種寫法。命中回 `{ toPath, statusCode }`，**未命中回 404 `NOT_FOUND`**
        （那是正常結果，不是錯誤）。
      x-handler: RedirectHandler.ResolveAsync
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 命中的轉址規則。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [toPath, statusCode]
                        properties:
                          toPath: { type: string }
                          statusCode: { type: integer, format: int32, examples: [301] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /home:
    get:
      tags: [公開・內容]
      operationId: getHome
      summary: 首頁版位
      description: |
        讀的是**首頁那筆 Page 已核准版本的快照**，不是 `HomeSections` 即時表。
        例外：版位 `specialties`（困擾）、`doctors`、`clinics` 的名單與順序改成算繪當下取整個單元
        （依該單元的 `SortOrder`，決策 30）；項目的 `urlPath`／`slug` 用即時值、`title` 用已發布快照。
        `settings` 在快照裡是 JSON 字串，這裡已解析成物件／陣列（首頁主視覺輪播的最外層是陣列）。
        `Cache-Control: public, max-age=300, stale-while-revalidate=60`。
      x-handler: PublicContentHandler.HomeAsync
      responses:
        '200':
          description: 版位陣列。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PublicHomeSection' }
        '500': { $ref: '#/components/responses/InternalError' }

  /menu:
    get:
      tags: [公開・內容]
      operationId: getPublicMenu
      summary: 導覽選單與頁尾
      description: |
        `label` 留空的節點會被填成被指到那筆內容的標題（取已發布快照）；`autoChildren` 非 0 的節點，
        `children` 在這裡是算繪當下由該單元整批取得的結果。
        `Cache-Control: public, max-age=300, stale-while-revalidate=60`。
      x-handler: PublicContentHandler.MenuAsync
      responses:
        '200':
          description: 兩份選單。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [main, footer]
                        properties:
                          main:
                            type: array
                            items: { $ref: '#/components/schemas/PublicMenuNode' }
                          footer:
                            type: array
                            items: { $ref: '#/components/schemas/PublicMenuNode' }
        '500': { $ref: '#/components/responses/InternalError' }

  /search:
    get:
      tags: [公開・內容]
      operationId: searchSite
      summary: 站內搜尋
      description: |
        對 `ContentItems.SearchText`（發布時由已核准快照重算的純文字）做子字串比對，標題命中排前面。
        **不設筆數上限**（前台有各型別 tab 的筆數）。`q` 為空回空陣列。
        文章標籤、搜尋頁與 404 頁不會出現在結果裡；找不到可連結網址的結果整筆略過。
        `Cache-Control: no-store`。
      x-handler: SearchHandler.SearchAsync
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 命中結果（縮寫鍵是為了縮小傳輸量）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [t, u, ti, ex]
                          properties:
                            t: { type: string, description: 型別標籤（療程／肌膚困擾／文章…）。 }
                            u: { type: string, description: 站內網址。 }
                            ti: { type: string, description: 標題。 }
                            ex: { type: string, description: 摘要，最多 120 字。 }
        '500': { $ref: '#/components/responses/InternalError' }

  /site-settings/public:
    get:
      tags: [公開・內容]
      operationId: getPublicSiteSettings
      summary: 前台需要的全站設定（白名單）
      description: |
        只回前台真的要的鍵。收件信箱等內部設定**一律不外露**。
        `Cache-Control: public, s-maxage=60, max-age=30`。
      x-handler: SettingHandler.GetPublicAsync
      responses:
        '200':
          description: 公開設定。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PublicSiteSettings' }
        '500': { $ref: '#/components/responses/InternalError' }

  /contact:
    post:
      tags: [公開・表單與 AI]
      operationId: submitContact
      summary: 聯絡表單
      description: |
        **只寄通知信，不落庫**；唯一例外是 `message` 的文字本身會寫進 `QuestionInbox`
        （`Source = ContactForm`），姓名／電話／Email 絕不進資料庫。
        電話與 Email 至少擇一；`privacyConsent` 必須為 true。
        收件信箱未設定時不寄信、只記警告（仍回成功）。
      x-handler: FormHandler.SubmitContactAsync
      x-bot-check: { action: contact }
      x-rate-limit: { bucket: contact, scope: ip, default: '5 次 / 10 分鐘' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /questions/miss:
    post:
      tags: [公開・表單與 AI]
      operationId: recordMissedQuestion
      summary: 回寫未命中的問題
      description: |
        站內搜尋查無結果時回寫一筆到題庫成長清單（`QuestionInbox`），去重由伺服器端做。
        只收問題文字（≤500 字），不收任何可回連送出者的欄位。
        **AI 問答不走這一支**——那邊伺服器自己知道有沒有命中。
      x-handler: FormHandler.RecordMissedQuestionAsync
      x-bot-check: { action: questions_miss }
      x-rate-limit: { bucket: questions-miss, scope: ip, default: '5 次 / 10 分鐘' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MissedQuestionRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /ai/ask:
    post:
      tags: [公開・表單與 AI]
      operationId: askAi
      summary: 站內 AI 問答
      description: |
        Gemini 嵌入 ＋ Blob 單檔向量索引 ＋ 記憶體比對（決策 28）。`Cache-Control: no-store`。

        - **「答不出來」是 200 配 `answered: false`**，不是 4xx；`handoff.needed = true` 並帶 `reason`。
        - 模型永遠拿不到網址：片段在 prompt 裡是 `[S1]`、`[S2]`，由伺服器把模型回的 `SOURCES:` 對映回 `urlPath`。
        - 輸出後再過一次確定性掃描（高風險字詞、金額樣式），命中就改用未命中文案
          （`handoff.reason = needs_doctor`）。
        - **不存對話**：多輪由前台帶 `history`，伺服器只取最後 4 則（每則截 500 字）。
        - 只有模型／索引真的不能用才回 503 `AI_UNAVAILABLE`，且絕不退回用模型的一般知識回答。
      x-handler: AiHandler.AskAsync
      x-bot-check: { action: ai_ask }
      x-rate-limit: { bucket: ai-ask, scope: ip, default: '20 次 / 10 分鐘（app setting RateLimit:PublicQuota:ai-ask:*）' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiAskRequest' }
      responses:
        '200':
          description: 回答（含「答不出來」）。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiAskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AiUnavailable' }

  # ── SEO 產物（非信封，回純文字／XML／JSON）──────────────────────────

  /seo/robots.txt:
    get:
