      description: |
        內容來自設定鍵 `seo.robotsTxt`。**設定被清空時回 404（空 body），不送出空檔案。**
        `Cache-Control: public, max-age=3600, stale-while-revalidate=60`。
      x-handler: SeoHandler.RobotsAsync
      responses:
        '200':
          description: robots.txt 全文。
          content:
            text/plain: { schema: { type: string } }
