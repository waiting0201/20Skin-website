    get:
      tags: [後台・系統]
      operationId: listRiskTerms
      summary: 啟用中的高風險字詞
      description: 登入即可。編輯器即時提示的來源——是提示不是閘門。
      x-handler: ContentHandler.ListRiskTermsAsync
      x-permission: null
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 字詞陣列。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ═════════════════════════════════════════════════════════════════════
  # 後台：SEO 與 301
  # ═════════════════════════════════════════════════════════════════════

  /admin/redirect:
    get:
      tags: [後台・SEO 與 301]
      operationId: listRedirects
      summary: 301 規則清單（分頁）
      description: 預設新的在前，只有 `sortDir=asc` 才升冪。全部篩選在 SQL 層。
      x-handler: RedirectHandler.ListAsync
      x-permission: redirect.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: source
          in: query
          description: 1 遷移工具／2 人工新增／3 系統自動。
          schema: { type: integer, enum: [1, 2, 3] }
        - name: sortBy
          in: query
          description: 白名單鍵（`fromPath`／`createdAt`）；其他值由 ReadService 退回預設。
          schema: { type: string, enum: [fromPath, createdAt] }
        - name: sortDir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200':
          description: 分頁清單。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PagedResult'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/Redirect' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [後台・SEO 與 301]
      operationId: createRedirect
      summary: 新增一筆 301 規則
      description: |
        `fromPath` 會正規化。自我迴圈、轉址鏈 → 400；`fromPath` 已存在 → 409 `CONFLICT_DUPLICATE`；
        `toContentItemId` 指向不存在的內容 → 404。`statusCode` 預設 301、`source` 預設 2（人工新增）。
      x-handler: RedirectHandler.CreateAsync
      x-permission: redirect.manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedirectCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/RedirectOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/redirect/{id}:
    put:
      tags: [後台・SEO 與 301]
      operationId: updateRedirect
      summary: 更新一筆 301 規則
      description: 允許改 `fromPath`（會重新跑迴圈防護與重複檢查）。沒帶的 `fromPath`／`toPath`／`statusCode`／`isActive` 維持原值。
      x-handler: RedirectHandler.UpdateAsync
      x-permission: redirect.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedirectUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/RedirectOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [後台・SEO 與 301]
      operationId: deleteRedirect
      summary: 刪除一筆 301 規則
      x-handler: RedirectHandler.DeleteAsync
      x-permission: redirect.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/redirect/stats:
    get:
      tags: [後台・SEO 與 301]
      operationId: getRedirectStats
      summary: 301 統計卡（全表）
      x-handler: RedirectHandler.StatsAsync
      x-permission: redirect.manage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 統計。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RedirectStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/redirect/export:
    get:
      tags: [後台・SEO 與 301]
      operationId: exportRedirects
      summary: 匯出 CSV
      description: CSV 全文放在信封的 `data.csv`（API 一律 JSON，不直接回檔案）。
      x-handler: RedirectHandler.ExportAsync
      x-permission: redirect.manage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 匯出結果。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [count, fileName, csv]
                        properties:
                          count: { type: integer }
                          fileName: { type: string, examples: ['redirects-20260918-1530.csv'] }
                          csv: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/redirect/import:
    post:
      tags: [後台・SEO 與 301]
      operationId: importRedirects
      summary: 匯入 CSV
      description: |
        CSV 全文放在 JSON 的 `csv` 欄位（不是 multipart）。第一列為標頭，欄名不分大小寫：
        `FromPath`／`ToPath`（必填）、`ToContentItemId`、`StatusCode`、`IsActive`、`Source`。
        逐列驗證，失敗列放進 `errors`，不影響其他列。`overwriteExisting` 預設 false；
        為 true 時來源已存在改成更新 `ToPath`／`StatusCode`／`IsActive`，**不動 `Source` 與 `IsVerified`**。
      x-handler: RedirectHandler.ImportAsync
      x-permission: redirect.manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
                overwriteExisting: { type: boolean, default: false }
      responses:
        '200':
          description: 匯入摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RedirectImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/question:
    get:
      tags: [後台・SEO 與 301]
      operationId: listQuestions
      summary: 未命中題目清單（題庫成長）
      description: 權限沿用 FAQ 的編輯權（行銷角色有）。
      x-handler: QuestionHandler.ListAsync
      x-permission: content.faq.edit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          description: 1 待處理／2 已建題／3 忽略。
          schema: { type: integer, enum: [1, 2, 3] }
        - name: source
          in: query
          description: 1 站內搜尋無結果／2 AI 未命中／3 聯絡表單／4 人工。
          schema: { type: integer, enum: [1, 2, 3, 4] }
      responses:
        '200':
          description: 分頁清單。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PagedResult'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/QuestionListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/question/{id}:
    patch:
      tags: [後台・SEO 與 301]
      operationId: updateQuestion
      summary: 標記處理結果
      description: |
        `status = 2`（已建題）時 `linkedFaqContentItemId` 必填且必須是 FAQ；`3` 忽略；`1` 撤銷先前的處理決定。
      x-handler: QuestionHandler.UpdateAsync
      x-permission: content.faq.edit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [後台・SEO 與 301]
      operationId: deleteQuestion
      summary: 刪除題目
      x-handler: QuestionHandler.DeleteAsync
      x-permission: content.faq.edit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ═════════════════════════════════════════════════════════════════════
  # 後台：帳號與角色
  # ═════════════════════════════════════════════════════════════════════

  /admin/user:
    get:
      tags: [後台・帳號與角色]
      operationId: listUsers
      summary: 帳號清單（分頁）
      x-handler: AccountHandler.ListUsersAsync
      x-permission: account.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          description: 分頁清單。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PagedResult'
                          - type: object
                            properties:
                              items:
                                type: array
                                items: { $ref: '#/components/schemas/UserListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [後台・帳號與角色]
      operationId: createUser
      summary: 新增帳號
      description: |
        `userName` 只允許 `a-z0-9._@-`（不是 email、不分大小寫）；密碼下限 **6** 碼；至少一個角色。
        管理者填的密碼就是最終密碼，不強制首登更換。帳號重複 → 409 `CONFLICT_DUPLICATE`。
      x-handler: AccountHandler.CreateUserAsync
      x-permission: account.manage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '200':
          description: 新帳號 id。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id]
                        properties:
                          id: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/user/{id}:
    put:
      tags: [後台・帳號與角色]
      operationId: updateUser
      summary: 更新帳號
      description: |
        `userName` 不可變更。`isActive` 也用於重新啟用；啟用狀態改變時會更換 SecurityStamp。
        `roleIds` 有帶就整批取代（至少一個）；沒帶＝不動角色。`doctorId` 與 `notifyEmail` 沒帶會被清成 null。
      x-handler: AccountHandler.UpdateUserAsync
      x-permission: account.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [後台・帳號與角色]
      operationId: deactivateUser
      summary: 停用帳號（軟刪除）
      description: 不可停用目前登入的自己（409 `CONFLICT_STATE`）。立即讓既發權杖失效。
      x-handler: AccountHandler.DeactivateUserAsync
      x-permission: account.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/user/{id}/password:
    put:
      tags: [後台・帳號與角色]
      operationId: resetUserPassword
      summary: 重設密碼
      description: 新密碼下限 6 碼。同時更換 SecurityStamp 使既發權杖失效。重設出來的就是最終密碼。
      x-handler: AccountHandler.ResetPasswordAsync
      x-permission: account.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: { type: string, minLength: 6 }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/role:
    get:
      tags: [後台・帳號與角色]
      operationId: listRoles
      summary: 角色與權限目錄
      x-handler: AccountHandler.ListRolesAsync
      x-permission: account.manage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 角色（含已授權碼）與完整權限目錄。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RolePermissionMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/role/{id}/permissions:
    put:
      tags: [後台・帳號與角色]
      operationId: updateRolePermissions
      summary: 整批設定角色的權限
      description: |
        `permissionCodes` 整批取代。未知的權限碼 → 400。移除唯一持有 `account.manage` 的角色的該權限 →
        409 `CONFLICT_STATE`（否則沒人能再管理帳號）。
      x-handler: AccountHandler.UpdateRolePermissionsAsync
      x-permission: account.manage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionCodes]
              properties:
                permissionCodes:
                  type: array
                  items: { $ref: '#/components/schemas/PermissionCode' }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

# ═══════════════════════════════════════════════════════════════════════════
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        自簽 JWT（audience `20skin-admin`）。claims：`sub`、`roles`、`permissions`、`is_superadmin`。
        由 `POST /auth/login` 取得，`POST /auth/refresh` 換發。access token 只放記憶體。

  # ─────────────────────────────────────────────────────────────────────
  parameters:
    UnitPath:
      name: unit
      in: path
      required: true
      description: 九個內容單元代號，與權限碼前綴逐字對應（不做單複數轉換）。其他值回 404。
      schema: { $ref: '#/components/schemas/UnitCode' }
    IdPath:
      name: id
      in: path
      required: true
      description: 數字識別碼。內容端點格式錯誤回 400 `VALIDATION_FORMAT`；其他資源格式錯誤回 404。
      schema: { type: integer }
    VersionNoPath:
      name: no
      in: path
      required: true
      description: 版本號。
      schema: { type: integer }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: 預設 20，夾在 1–100。
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Keyword:
      name: keyword
      in: query
      description: 在 SQL 層過濾。
      schema: { type: string }
    Origin:
      name: origin
      in: query
      description: |
        sitemap 裡網址用的 origin。必須是 http／https 絕對網址，否則退回 `https://20skin.tw`。
        由 Nuxt 從請求推導（正式站、測試站與 SWA 預覽是三個主機名）。
      schema: { type: string, format: uri }

  # ─────────────────────────────────────────────────────────────────────
  responses:
    OkMessage:
      description: 成功，只有訊息，`data` 為 null。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    OkNull:
      description: 成功，`data` 為 null。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    TokenOk:
      description: 憑證與身分。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenResponse' }
    ContentDetail:
      description: 內容詳情。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/ContentDetail' }
    RedirectOk:
      description: 轉址規則。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Redirect' }
    BadRequest:
      description: |
        400。`VALIDATION_REQUIRED`／`VALIDATION_FORMAT`／`VALIDATION_RANGE`，
        以及 `UPLOAD_TYPE`／`UPLOAD_SIZE`／`BOT_CHECK_FAILED`。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: 401 `AUTH_TOKEN_INVALID`：缺少、過期或簽章不符的憑證。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: |
        403。`FORBIDDEN`（權限碼不足、未登記於權限表的 /admin/* 路徑、醫師動別人的內容、
        法務頁限超級管理員）或 `AUTH_ACCOUNT_INACTIVE`。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 404 `NOT_FOUND`。未登記的路由也是這個（訊息為「端點不存在」）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: |
        409。`CONFLICT_DUPLICATE`（網址／slug／帳號重複，含資料庫唯一鍵違反）、
        `CONFLICT_STATE`（狀態不允許、仍被引用，含外鍵違反）、`CONFLICT_LOCKED`（系統鎖定）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    TooManyRequests:
      description: 429 `RATE_LIMITED`。超限後鎖一整個視窗。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AiUnavailable:
      description: 503 `AI_UNAVAILABLE`：模型服務連不上／逾時／金鑰未設定／語料索引尚未建立。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: 500 `INTERNAL`。不洩漏堆疊，細節只進 Application Insights。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  # ─────────────────────────────────────────────────────────────────────
  schemas:
    # ── 信封與共用 ─────────────────────────────────────────────────────

    Envelope:
      type: object
      description: |
        統一回應信封（`Common/ApiResponse.cs`）。所有 JSON 端點一律用它，**不回裸 data**。
        前端一律以 `code` 分支，**不得比對 `message` 字串**。成功時 `code` 為 null。
      required: [success, code, data, message, errors, timestamp]
      properties:
        success: { type: boolean }
        code:
          description: 成功為 null；失敗為 ErrorCode。
          oneOf:
            - $ref: '#/components/schemas/ErrorCode'
            - type: 'null'
        data:
          description: 依端點而定；失敗為 null。
        message:
          type: string
          description: 給人看。成功時多半是 `Success`。
        errors:
          type: array
          items: { type: string }
          description: 錯誤細節。
        timestamp:
          type: string
          format: date-time

    ErrorEnvelope:
      description: 失敗信封。
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            success: { type: boolean, const: false }
            code: { $ref: '#/components/schemas/ErrorCode' }
            data: { type: 'null' }

    ErrorCode:
      type: string
      description: |
        錯誤碼值域（`Common/ErrorCodes.cs`）。注意 `AUTH_MUST_CHANGE_PASSWORD` 目前程式碼中
        已沒有任何地方丟出（首登強制改密碼 2026-09-17 移除），常數保留。
      enum:
        - VALIDATION_REQUIRED
        - VALIDATION_FORMAT
        - VALIDATION_RANGE
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_INVALID
        - AUTH_MUST_CHANGE_PASSWORD
        - AUTH_ACCOUNT_INACTIVE
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT_DUPLICATE
        - CONFLICT_STATE
        - CONFLICT_LOCKED
        - UPLOAD_TYPE
        - UPLOAD_SIZE
        - RATE_LIMITED
        - BOT_CHECK_FAILED
        - AI_UNAVAILABLE
        - INTERNAL

    PagedResult:
      type: object
      description: 後台清單的分頁形狀。`items` 由各端點的 allOf 補上型別。
      required: [items, totalCount, page, pageSize, totalPages]
      properties:
        items: { type: array, items: {} }
        totalCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }

    UnitCode:
      type: string
      enum: [treatment, doctor, concern, article, case, faq, clinic, page, term]

    PermissionCode:
      type: string
      description: |
        28 個權限碼（種子在 `Data/Seed/SeedData.cs`）。`content.{unit}.edit`／`.publish` 九個單元各一對（共 18）。
      enum:
        - content.treatment.edit
        - content.treatment.publish
        - content.doctor.edit
        - content.doctor.publish
        - content.concern.edit
        - content.concern.publish
        - content.article.edit
        - content.article.publish
        - content.case.edit
        - content.case.publish
        - content.faq.edit
        - content.faq.publish
        - content.clinic.edit
        - content.clinic.publish
        - content.page.edit
        - content.page.publish
        - content.term.edit
        - content.term.publish
        - seo.edit
        - redirect.manage
        - taxonomy.tag.create
        - taxonomy.category.manage
        - page.legal.edit
        - home.arrange
        - menu.edit
        - settings.edit
        - account.manage
        - upload.file

    UploadedImage:
      type: object
      description: |
        圖片值——內容欄位裡存下來的形狀，也是 `POST /admin/upload/commit` 的回傳。
        `url` 與 `blobPath` 必須原封不動來自 commit，少了 `blobPath` 換圖時就找不到檔案可刪。
      required: [blobPath, url]
      properties:
        blobPath: { type: string }
        url: { type: string }
        alt: { type: [string, 'null'] }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        variants: { type: [string, 'null'] }

    NullableImage:
      description: 可為空的圖片欄位。
      oneOf:
        - $ref: '#/components/schemas/UploadedImage'
        - type: 'null'

    # ── 認證 ───────────────────────────────────────────────────────────

    LoginRequest:
      type: object
      required: [userName, password]
      properties:
        userName: { type: string, description: 登入識別，不是 email。 }
        password: { type: string }
        botCheckToken: { type: string, description: 機器人驗證權杖（reCAPTCHA v3，action `login`）。 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8 }

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, userId, userName, displayName, roles, permissions, isSuperAdmin, mustChangePassword]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        userId: { type: integer }
        userName: { type: string }
        doctorId: { type: [integer, 'null'], description: 醫師角色綁定的個人頁；非醫師為 null。 }
        displayName: { type: string }
        roles:
          type: array
          items: { type: string, enum: [SuperAdmin, Editor, Doctor, Marketing] }
        permissions:
          type: array
          description: 前端權限判斷的唯一依據。
          items: { $ref: '#/components/schemas/PermissionCode' }
        isSuperAdmin: { type: boolean }
        mustChangePassword:
          type: boolean
          description: 惰性欄位，目前一律 false，不要拿它擋人。

    # ── 公開：表單與 AI ───────────────────────────────────────────────

    ContactRequest:
      type: object
      required: [name, message, privacyConsent]
      properties:
        name: { type: string }
        phone: { type: [string, 'null'], description: 與 email 至少擇一。 }
        email: { type: [string, 'null'], format: email }
        site: { type: [string, 'null'], description: 想詢問的院區。只進通知信，不落庫。 }
        topic: { type: [string, 'null'], description: 詢問主題。只進通知信，不落庫。 }
        message: { type: string }
        privacyConsent: { type: boolean, description: 必須為 true。 }
        botCheckToken: { type: string, description: reCAPTCHA v3，action `contact`。 }

    MissedQuestionRequest:
      type: object
      required: [questionText, source]
      properties:
        questionText: { type: string, maxLength: 500 }
        source: { type: string, enum: [search, ai-faq] }
        botCheckToken: { type: string, description: reCAPTCHA v3，action `questions_miss`。 }

    AiAskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 300 }
        history:
          type: array
          description: 先前幾則對話。伺服器只取最後 4 則，且明確標注「不得作為事實來源」。
          items:
            type: object
            properties:
              role: { type: string, enum: [user, assistant] }
              text: { type: string, maxLength: 500 }
        botCheckToken: { type: string, description: reCAPTCHA v3，action `ai_ask`。 }

    AiAskResponse:
      type: object
      required: [answer, answered, sources, handoff, disclaimer]
      properties:
        answer: { type: string }
        answered: { type: boolean, description: false＝答不出來（仍是 HTTP 200）。 }
        sources:
          type: array
          description: 引用的站內頁面。主站舊文（`sourceSite = 1`）不會出現在這裡。最多 3 筆。
          items:
            type: object
            required: [title, url, kind]
            properties:
              title: { type: string }
              url: { type: string, description: 由伺服器對映，模型看不到網址。 }
              kind: { type: string, description: 型別標籤（療程／文章…）。 }
        handoff:
          type: object
          required: [needed, reason]
          properties:
            needed: { type: boolean }
            reason:
              type: [string, 'null']
              description: 前台依它分支文案。目前程式只會產生 `no_match` 與 `needs_doctor`。
              enum: [no_match, needs_doctor, null]
        disclaimer: { type: string }

    # ── 公開：內容 ─────────────────────────────────────────────────────

    PublicContentRecord:
      type: object
      description: |
        已核准版本快照（`ContentVersions.Snapshot`）加上少數即時覆寫。
        **結構性欄位用即時值**（`id`、`contentType`、`slug`、`urlPath`、`sortOrder`、
        `includeInSitemap`、`updatedAt`）；**內容性欄位用快照**（`title`、`summary`、`fields`）。
        `fields` 的形狀逐單元不同，與後台 `ContentDetail.fields` 同鍵。
      required: [id, contentType, slug, urlPath, title, indexable]
      additionalProperties: true
      properties:
        id: { type: integer }
        contentType: { type: integer, enum: [1, 2, 3, 4, 5, 6, 7, 8, 9], description: '1 療程／2 醫師／3 困擾／4 文章／5 案例／6 FAQ／7 據點／8 頁面／9 分類。' }
        slug: { type: [string, 'null'] }
        urlPath: { type: [string, 'null'] }
        title: { type: string }
        summary: { type: [string, 'null'] }
        sortOrder: { type: integer }
        includeInSitemap: { type: boolean }
        updatedAt: { type: string, description: 'ISO 本地格式（`s`），例如 `2026-09-18T15:30:00`。' }
        indexable: { type: boolean, description: 是否值得被索引（與 sitemap 同一個判斷）。 }
        fields: { type: object, additionalProperties: true }
        seo:
          type: [object, 'null']
          additionalProperties: true
        relations:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              toContentItemId: { type: integer }
              toSlug: { type: [string, 'null'] }
              toUrlPath: { type: [string, 'null'] }
              toTitle: { type: [string, 'null'], description: 取已發布快照的標題。 }
              toIsPublished: { type: boolean, description: 前台看得到＝true（不是 Status = 3）。 }

    PublicArticlePage:
      type: object
      description: 文章列表的分頁形狀（沒有 `totalPages`）。
      required: [items, page, pageSize, totalCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicContentRecord' }
        page: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }

    PublicHomeSection:
      type: object
      required: [sectionKey, isEnabled, sortOrder, items]
      properties:
        sectionKey: { type: string }
        title: { type: [string, 'null'] }
        subtitle: { type: [string, 'null'] }
        isEnabled: { type: boolean }
        sortOrder: { type: integer }
        settings:
          description: 版位設定，已由 JSON 字串解析成物件／陣列；沒有設定為 null。
        items:
          type: array
          items:
            type: object
            required: [contentItemId, contentType, urlPath, title, sortOrder]
            properties:
              contentItemId: { type: integer }
              contentType: { type: integer }
              slug: { type: [string, 'null'] }
              urlPath: { type: [string, 'null'] }
              title: { type: string }
              sortOrder: { type: integer }

    PublicMenuNode:
      type: object
      required: [label, linkKind, url, external, openInNewTab, children]
      properties:
        label: { type: string, description: 留空的節點已被填成被指到內容的標題。 }
        linkKind: { type: integer, enum: [1, 2, 3], description: 1 站內內容／2 站內路徑／3 外部網址。 }
        url: { type: [string, 'null'] }
        external: { type: boolean }
        relAttr: { type: [string, 'null'] }
        openInNewTab: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/PublicMenuNode' }

    PublicSiteSettings:
      type: object
      required: [siteName, siteDescription, aiFaqEnabled, aiFaqPanelTitle, aiFaqWelcomeText, aiFaqHandoffBookingUrl, aiFaqHandoffLineUrl, trackingIds, socialLinks, footerCopyright]
      properties:
        siteName: { type: string }
        siteDescription: { type: string }
        aiFaqEnabled: { type: boolean }
        aiFaqPanelTitle: { type: string }
        aiFaqWelcomeText: { type: string }
        aiFaqHandoffBookingUrl: { type: string }
        aiFaqHandoffLineUrl: { type: string, description: 填了就統一用這一個，院區清單不出現（決策 28）。 }
        trackingIds: { type: string, description: 'GA4／GTM 識別碼，逗號分隔，例如 `G-ABCD1234,GTM-XYZ9876`。' }
        socialLinks:
          type: array
          description: 頁尾社群連結；來源 JSON 解析失敗時為空陣列。
          items:
            type: object
            required: [label, url]
            properties:
              label: { type: string }
              url: { type: string }
        footerCopyright: { type: string }

    # ── 後台：內容單元 ─────────────────────────────────────────────────

    ContentUnitCounts:
      type: object
      required: [draft, inReview, published, unpublished]
      properties:
        draft: { type: integer }
        inReview: { type: integer }
        published: { type: integer }
        unpublished: { type: integer }

    ContentListItem:
      type: object
      required: [id, unit, title, status, statusName, effectiveStatus, sortOrder, includeInSitemap, isSystemLocked, updatedAt]
      properties:
        id: { type: integer }
        unit: { $ref: '#/components/schemas/UnitCode' }
        title: { type: string }
        slug: { type: [string, 'null'] }
        urlPath: { type: [string, 'null'] }
        status: { type: integer, enum: [1, 2, 3, 4], description: 1 草稿／2 送審中（舊資料）／3 已發布／4 已下架。 }
        statusName: { type: string, enum: [草稿, 送審中, 已發布, 已下架] }
        effectiveStatus:
          type: string
          description: 顯示用推導狀態（由 Status 與排程時間推導，不是資料庫欄位）。
          enum: [draft, inReview, published, scheduled, expired, unpublished]
        publishAt: { type: [string, 'null'], format: date-time }
        unpublishAt: { type: [string, 'null'], format: date-time }
        sortOrder: { type: integer }
        includeInSitemap: { type: boolean }
        isSystemLocked: { type: boolean }
        ownerUserId: { type: [integer, 'null'] }
        categoryTermId: { type: [integer, 'null'] }
        categoryTitle: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        usageCount: { type: [integer, 'null'], description: 只有 `term` 有值。 }
        fields:
          type: [object, 'null']
          description: 逐單元的少數清單顯示欄位（不是完整的詳情 fields）。
          additionalProperties: true

    ContentDetail:
      type: object
      required: [id, unit, contentType, title, status, statusName, effectiveStatus, sortOrder, includeInSitemap, isSystemLocked, createdAt, updatedAt, fields, relations]
      properties:
        id: { type: integer }
        unit: { $ref: '#/components/schemas/UnitCode' }
        contentType: { type: integer, enum: [1, 2, 3, 4, 5, 6, 7, 8, 9] }
        slug: { type: [string, 'null'] }
        urlPath: { type: [string, 'null'] }
        title: { type: string }
        summary: { type: [string, 'null'], description: 一句話導言（≤500 字），不是 `seo.aiSummary`。 }
        status: { type: integer, enum: [1, 2, 3, 4] }
        statusName: { type: string }
        effectiveStatus:
          type: string
          enum: [draft, inReview, published, scheduled, expired, unpublished]
        publishAt: { type: [string, 'null'], format: date-time }
        unpublishAt: { type: [string, 'null'], format: date-time }
        publishedVersionId: { type: [integer, 'null'] }
        sortOrder: { type: integer }
        includeInSitemap: { type: boolean }
        isSystemLocked: { type: boolean }
        ownerUserId: { type: [integer, 'null'] }
        createdByUserId: { type: [integer, 'null'] }
        updatedByUserId: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        fields: { $ref: '#/components/schemas/ContentFields' }
        seo:
          oneOf:
            - $ref: '#/components/schemas/SeoMeta'
            - type: 'null'
        relations:
          type: array
          items: { $ref: '#/components/schemas/RelationItem' }

    ContentFields:
      description: |
        型別專屬欄位，依單元（`unit`）擇一。不是 discriminated union——判斷靠外層的 `unit`。
      anyOf:
        - $ref: '#/components/schemas/TreatmentFields'
        - $ref: '#/components/schemas/DoctorFields'
        - $ref: '#/components/schemas/ConcernFields'
        - $ref: '#/components/schemas/ArticleFields'
        - $ref: '#/components/schemas/CaseFields'
        - $ref: '#/components/schemas/FaqFields'
        - $ref: '#/components/schemas/ClinicFields'
        - $ref: '#/components/schemas/PageFields'
        - $ref: '#/components/schemas/TermFields'

    TreatmentFields:
      type: object
      description: '`treatment`。`categoryTermId` 新增時必填。'
      properties:
        categoryTermId: { type: integer }
        nameEn: { type: [string, 'null'] }
        subtitle: { type: [string, 'null'] }
        indications: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        mechanism: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        durationText: { type: [string, 'null'] }
        sessionsText: { type: [string, 'null'] }
        aftercare: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        contraindications: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        deviceInfo: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        facts: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        steps: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        cover: { $ref: '#/components/schemas/NullableImage' }
        images:
          type: array
          description: 有帶就整批取代。
          items:
            type: object
            properties:
              image: { $ref: '#/components/schemas/UploadedImage' }
              caption: { type: [string, 'null'] }
              sortOrder: { type: integer }

    DoctorFields:
      type: object
      description: '`doctor`（團隊成員，含非醫師的藝術總監）。'
      properties:
        jobTitle: { type: [string, 'null'] }
        isPhysician: { type: boolean }
        specialty: { type: [string, 'null'] }
        photo: { $ref: '#/components/schemas/NullableImage' }
        bio: { type: [string, 'null'] }
        publications: { type: [string, 'null'] }
        tags:
          type: array
          items:
            type: object
            properties:
              type: { type: integer, enum: [1, 2], description: 1 專長／2 擅長項目（DoctorTagType）。 }
              tag: { type: string }
              sortOrder: { type: integer }
        credentials:
          type: array
          items:
            type: object
            properties:
              type: { type: integer, description: 1 學歷／2 經歷／3 證照（CredentialType）。 }
              text: { type: string }
              sortOrder: { type: integer }
        schedules:
          type: array
          items:
            type: object
            properties:
              clinicId: { type: integer }
              dayOfWeek: { type: integer }
              startTime: { type: string, examples: ['09:00'] }
              endTime: { type: string, examples: ['12:00'] }
              note: { type: [string, 'null'] }

    ConcernFields:
      type: object
      description: '`concern`（肌膚困擾）。'
      properties:
        symptoms: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        causes: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        selfCheckGuide: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        whenToSeeDoctor: { type: [string, 'null'], description: 區塊 JSON，以 JSON 字串送。 }
        recommendationIntro: { type: [string, 'null'] }
        cover: { $ref: '#/components/schemas/NullableImage' }

    ArticleFields:
      type: object
      description: '`article`。⚠️ `bodyBlocks` 寫入要送物件／陣列（不是 JSON 字串），與其他區塊 JSON 欄位相反。'
      properties:
        categoryTermId: { type: integer }
        authorDoctorId: { type: [integer, 'null'] }
        authorName: { type: [string, 'null'] }
        reviewerDoctorId: { type: [integer, 'null'] }
        reviewedOn: { type: [string, 'null'], format: date }
        displayDate: { type: [string, 'null'] }
        cover: { $ref: '#/components/schemas/NullableImage' }
        bodyBlocks: {}
        readingMinutes: { type: [integer, 'null'] }
        sourceSite: { type: integer, description: '1 主站／2 blog 站（ArticleSourceSite）。主站舊文為 1，AI 檢索降權且不列為來源。' }

    CaseFields:
      type: object
      description: '`case`（案例）。'
      properties:
        treatmentId: { type: [integer, 'null'] }
        sessionsText: { type: [string, 'null'] }
        narrative: { type: [string, 'null'] }
        individualVarianceStatement: { type: [string, 'null'] }
        hasWrittenConsent: { type: boolean }
        consentReference: { type: [string, 'null'] }
        shootingConditions: { type: [string, 'null'] }
        images:
          type: array
          items:
            type: object
            properties:
              image: { $ref: '#/components/schemas/UploadedImage' }
              phase: { type: integer, enum: [1, 2], description: 1 術前／2 術後（CasePhase）。 }
              takenOn: { type: [string, 'null'], format: date }
              sortOrder: { type: integer }

    FaqFields:
      type: object
      description: '`faq`。'
      properties:
        categoryTermId: { type: integer }
        webAnswer: { type: [string, 'null'] }
        aiAnswer: { type: [string, 'null'] }
        lastReviewedOn: { type: string, format: date }
        reviewedBy: { type: [string, 'null'] }

    ClinicFields:
      type: object
      description: '`clinic`（據點）。'
      properties:
        address: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        lineUrl: { type: [string, 'null'], description: AI 面板「轉 LINE 諮詢」依院區分流的來源。 }
        latitude: { type: [number, 'null'] }
        longitude: { type: [number, 'null'] }
        mapUrl: { type: [string, 'null'] }
        transportInfo: { type: [string, 'null'] }
        intro: { type: [string, 'null'] }
        businessHours:
          type: array
          items:
            type: object
            properties:
              dayOfWeek: { type: integer }
              startTime: { type: string, examples: ['09:00'] }
              endTime: { type: string, examples: ['21:00'] }
              sortOrder: { type: integer }
        photos:
          type: array
          items:
            type: object
            properties:
              image: { $ref: '#/components/schemas/UploadedImage' }
              caption: { type: [string, 'null'] }
              sortOrder: { type: integer }

    PageFields:
      type: object
      description: |
        `page`。系統頁（`pageKind = 2`）不可新增、不可刪除、不可改 slug；法務三頁
        （`superAdminOnly`）限超級管理員。`bodyBlocks` 依 slug 分派 schema（見決策 17）。
      properties:
        pageKind: { type: integer, enum: [1, 2], description: 1 自由頁／2 系統頁。 }
        systemKey: { type: [string, 'null'], description: '系統頁識別碼（home、team-index…共 11 筆）；唯讀。' }
        lead: { type: [string, 'null'] }
        bodyBlocks: {}
        cover: { $ref: '#/components/schemas/NullableImage' }
        listSortRule: { type: [string, 'null'] }
        pageSize: { type: [integer, 'null'] }
        superAdminOnly: { type: boolean }

    TermFields:
      type: object
      description: '`term`（分類與標籤）。`termType` 新增時必填。'
      properties:
        termType: { type: integer, enum: [1, 2, 3, 4], description: 1 療程分類／2 文章分類／3 FAQ 分類／4 文章標籤。 }
        intro: { type: [string, 'null'] }
        cover: { $ref: '#/components/schemas/NullableImage' }
        usageCount: { type: integer, readOnly: true, description: 唯讀，只在詳情回應出現。 }

    ContentSaveRequest:
      type: object
      description: |
        新增／更新內容。共同欄位**永遠在頂層**；型別專屬欄位放巢狀 `fields`，或直接攤在頂層
        （**帶了 `fields` 就只讀 `fields`**，頂層同名欄位忽略）。**欄位沒帶＝不動該欄位**
        （不是清空）。必須是 JSON 物件。
      additionalProperties: true
      properties:
        title: { type: string, maxLength: 200, description: 新增時必填。 }
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', description: 新增時必填；系統鎖定的內容不可改。 }
        summary: { type: [string, 'null'], maxLength: 500 }
        sortOrder: { type: integer }
        includeInSitemap: { type: boolean }
        ownerUserId: { type: [integer, 'null'], description: 醫師角色送了也會被忽略／強制為自己。 }
        fields: { $ref: '#/components/schemas/ContentFields' }

    SeoMeta:
      type: object
      properties:
        seoTitle: { type: [string, 'null'] }
        metaDescription: { type: [string, 'null'] }
        ogImage: { $ref: '#/components/schemas/NullableImage' }
        canonicalOverride: { type: [string, 'null'] }
        noIndex: { type: boolean }
        structuredDataOverride: { type: [string, 'null'], description: 整段取代自動產生的 JSON-LD（預設不在後台露出入口）。 }
        aiSummary: { type: [string, 'null'] }
        updatedByUserId: { type: [integer, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }

    SeoSaveRequest:
      type: object
      properties:
        seoTitle: { type: [string, 'null'], maxLength: 200 }
        metaDescription: { type: [string, 'null'], maxLength: 400 }
        ogImage: { $ref: '#/components/schemas/NullableImage' }
        canonicalOverride: { type: [string, 'null'] }
        noIndex: { type: boolean }
        structuredDataOverride: { type: [string, 'null'] }
        aiSummary: { type: [string, 'null'], description: 有填時須 20–300 字。 }

    RelationItem:
      type: object
      description: |
        一筆關聯，正向與反向共用。`to*` 永遠是「對方」。`isReverse = true` 唯讀，
        不可拿去寫回 `PUT .../relations`。
      required: [toContentItemId, toContentType, relationType, sortOrder, isReverse]
      properties:
        toContentItemId: { type: integer }
        toContentType: { type: integer }
        relationType: { type: integer, description: 1–14，見 RelationType（12 為頁面精選項目）。 }
        sortOrder: { type: integer }
        note: { type: [string, 'null'] }
        toTitle: { type: [string, 'null'] }
        toUrlPath: { type: [string, 'null'] }
        isReverse: { type: boolean }

    RelationSaveItem:
      type: object
      required: [relationType, toContentItemId]
      properties:
        relationType: { type: integer }
        toContentItemId: { type: integer }
        sortOrder: { type: integer }
        note: { type: [string, 'null'] }

    SortItem:
      type: object
      required: [id, sortOrder]
      properties:
        id: { type: integer }
        sortOrder: { type: integer }

    ScheduleRequest:
      type: object
      properties:
        publishAt: { type: [string, 'null'], format: date-time }
        unpublishAt: { type: [string, 'null'], format: date-time }

    PublishRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [publish, unpublish] }

    VersionListItem:
      type: object
      required: [id, versionNo, title, createdAt]
      properties:
        id: { type: integer }
        versionNo: { type: integer }
        title: { type: string }
        note: { type: [string, 'null'] }
        createdByUserId: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }

    VersionDetail:
      allOf:
        - $ref: '#/components/schemas/VersionListItem'
        - type: object
          required: [snapshot]
          properties:
            snapshot: { type: string, description: 版本快照的原始 JSON 字串，供前端自行 parse 做差異比對。 }

    # ── 後台：站台編排與系統 ──────────────────────────────────────────

    HomeSection:
      type: object
      required: [id, sectionKey, title, isEnabled, sortOrder, items]
      properties:
        id: { type: integer }
        sectionKey: { type: string }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        isEnabled: { type: boolean }
        sortOrder: { type: integer }
        settings: { type: [string, 'null'], description: JSON 字串（主視覺輪播的最外層必須是陣列）。 }
        items:
          type: array
          items:
            type: object
            required: [id, contentItemId, contentTitle, contentType, sortOrder]
            properties:
              id: { type: integer }
              contentItemId: { type: integer }
              contentTitle: { type: string }
              contentUrlPath: { type: [string, 'null'] }
              contentType: { type: integer }
              sortOrder: { type: integer }

    HomeSectionUpdateRequest:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          minItems: 1
          items:
            type: object
            required: [sectionKey, isEnabled, sortOrder, items]
            properties:
              sectionKey: { type: string }
              isEnabled: { type: boolean }
              sortOrder: { type: integer }
              settings: { type: [string, 'null'], description: 須為合法 JSON 字串。 }
              items:
                type: array
                items:
                  type: object
                  required: [contentItemId, sortOrder]
                  properties:
                    contentItemId: { type: integer }
                    sortOrder: { type: integer }

    MenuNode:
      type: object
      description: 讀寫共用。樹狀靠 `children` 巢狀表示；`id` 寫入時 null＝新增。最多兩層。
      required: [label, linkKind, children]
      properties:
        id: { type: [integer, 'null'] }
        label: { type: string, description: 只有 `linkKind = 1` 可留空（跟著被指到內容的標題走）。 }
        linkKind: { type: integer, enum: [1, 2, 3], description: 1 站內內容／2 站內路徑／3 外部網址。 }
        contentItemId: { type: [integer, 'null'] }
        url: { type: [string, 'null'] }
        relAttr: { type: [string, 'null'] }
        openInNewTab: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/MenuNode' }
        contentType: { type: [integer, 'null'], readOnly: true, description: 唯讀，寫入時忽略。 }
        contentTitle: { type: [string, 'null'], readOnly: true, description: 唯讀，寫入時忽略。 }
        autoChildren:
          type: integer
          enum: [0, 1, 2, 3, 4]
          default: 0
          description: 0 自己維護／1 全部困擾／2 全部療程分類／3 全部文章分類／4 全部據點。只能掛在頂層。

    MenuTree:
      type: object
      properties:
        main:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/MenuNode' }
        footer:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/MenuNode' }

    SiteSettingAdminItem:
      type: object
      required: [settingKey, settingValue, valueType, updatedAt]
      properties:
        settingKey: { type: string }
        settingValue: { type: string }
        valueType: { type: string, description: SettingValueType 的名稱。, enum: [Text, Number, Boolean, Json, Url] }
        updatedByUserId: { type: [integer, 'null'] }
        updatedByUserName: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }

    ExportPreview:
      type: object
      required: [kind, itemCount, generatedAt, content]
      properties:
        kind: { type: string }
        itemCount: { type: integer }
        generatedAt: { type: string, format: date-time }
        content: { type: string, description: 預覽內容全文（JSON 或純文字）。 }

    # ── 後台：301 與題庫 ──────────────────────────────────────────────

    Redirect:
      type: object
      required: [id, fromPath, toPath, statusCode, isActive, source, isVerified, createdAt]
      properties:
        id: { type: integer }
        fromPath: { type: string }
        toPath: { type: string }
        toContentItemId: { type: [integer, 'null'] }
        statusCode: { type: integer, examples: [301] }
        isActive: { type: boolean }
        source: { type: integer, enum: [1, 2, 3], description: 1 遷移工具／2 人工新增／3 系統自動。 }
        isVerified: { type: boolean }
        createdAt: { type: string, format: date-time }

    RedirectCreateRequest:
      type: object
      required: [fromPath, toPath]
      properties:
        fromPath: { type: string, description: 舊路徑，可含 query string。伺服器端會正規化。 }
        toPath: { type: string }
        toContentItemId: { type: [integer, 'null'] }
        statusCode: { type: integer, default: 301 }
        isActive: { type: boolean, default: true }
        source: { type: integer, enum: [1, 2, 3], default: 2 }

    RedirectUpdateRequest:
      type: object
      properties:
        fromPath: { type: string }
        toPath: { type: string }
        toContentItemId: { type: [integer, 'null'], description: 沒帶會被清成 null。 }
        statusCode: { type: integer }
        isActive: { type: boolean }
        source: { type: integer, enum: [1, 2, 3] }
        isVerified: { type: boolean }

    RedirectStats:
      type: object
      required: [totalCount, activeCount, verifiedCount, migrationCount, manualCount, systemCount]
      properties:
        totalCount: { type: integer }
        activeCount: { type: integer }
        verifiedCount: { type: integer }
        migrationCount: { type: integer }
        manualCount: { type: integer }
        systemCount: { type: integer }

    RedirectImportResult:
      type: object
      required: [totalRows, imported, updated, skipped, errors]
      properties:
        totalRows: { type: integer }
        imported: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [rowNumber, reason]
            properties:
              rowNumber: { type: integer, description: 第 1 列是標頭，資料從 2 起算。 }
              fromPath: { type: [string, 'null'] }
              reason: { type: string }

    QuestionListItem:
      type: object
      required: [id, questionText, source, hitCount, firstSeenAt, lastSeenAt, status]
      properties:
        id: { type: integer }
        questionText: { type: string }
        source: { type: integer, enum: [1, 2, 3, 4] }
        hitCount: { type: integer }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        status: { type: integer, enum: [1, 2, 3] }
        linkedFaqContentItemId: { type: [integer, 'null'] }
        linkedFaqTitle: { type: [string, 'null'] }
        handledByUserId: { type: [integer, 'null'] }
        handledByUserName: { type: [string, 'null'] }
        handledAt: { type: [string, 'null'], format: date-time }

    QuestionUpdateRequest:
      type: object
      required: [status]
      properties:
        status: { type: integer, enum: [1, 2, 3], description: 1 待處理／2 已建題／3 忽略。 }
        linkedFaqContentItemId: { type: [integer, 'null'], description: '`status = 2` 時必填。' }

    # ── 後台：帳號與角色 ──────────────────────────────────────────────

    UserListItem:
      type: object
      required: [id, userName, displayName, isActive, mustChangePassword, createdAt, updatedAt, roleCodes]
      properties:
        id: { type: integer }
        userName: { type: string, description: 登入識別，不是 email。 }
        displayName: { type: string }
        notifyEmail: { type: [string, 'null'] }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean, description: 惰性欄位。 }
        doctorId: { type: [integer, 'null'] }
        doctorName: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        roleCodes:
          type: array
          items: { type: string }

    UserCreateRequest:
      type: object
      required: [userName, displayName, password, roleIds]
      properties:
        userName: { type: string, pattern: '^[a-zA-Z0-9._@-]+$' }
        displayName: { type: string }
        password: { type: string, minLength: 6 }
        notifyEmail: { type: [string, 'null'] }
        doctorId: { type: [integer, 'null'] }
        roleIds:
          type: array
          minItems: 1
          items: { type: integer }

    UserUpdateRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string }
        notifyEmail: { type: [string, 'null'] }
        doctorId: { type: [integer, 'null'] }
        roleIds:
          type: array
          minItems: 1
          items: { type: integer }
        isActive: { type: boolean }

    RolePermissionMatrix:
      type: object
      required: [roles, allPermissions]
      properties:
        roles:
          type: array
          items:
            type: object
            required: [id, code, name, isSystem, permissionCodes]
            properties:
              id: { type: integer }
              code: { type: string, enum: [SuperAdmin, Editor, Doctor, Marketing] }
              name: { type: string }
              isSystem: { type: boolean }
              permissionCodes:
                type: array
                items: { $ref: '#/components/schemas/PermissionCode' }
        allPermissions:
          type: array
          items:
            type: object
            required: [id, code, name, groupName]
            properties:
              id: { type: integer }
              code: { $ref: '#/components/schemas/PermissionCode' }
              name: { type: string }
              groupName: { type: string }

# ═══════════════════════════════════════════════════════════════════════════
