  # ═════════════════════════════════════════════════════════════════════
  # 後台：上傳
  # ═════════════════════════════════════════════════════════════════════

  /admin/upload/sas:
    post:
      tags: [後台・系統]
      operationId: requestUploadSas
      summary: 取得短效上傳 SAS
      description: |
        瀏覽器直傳 Blob（write-only、短效，以 Managed Identity 簽發）。只收圖片
        （.jpg/.jpeg/.png/.gif/.webp，由 `fileName` 的副檔名判定）。**blob 名稱由伺服器決定。**
        不是媒體庫：沒有清單、沒有刪除端點。
      x-handler: UploadHandler.RequestSasAsync
      x-permission: upload.file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              properties:
                fileName: { type: string, description: 只用來判定副檔名。 }
      responses:
        '200':
          description: 上傳位址。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [blobPath, uploadUrl, expiresAt]
                        properties:
                          blobPath: { type: string, description: 暫存路徑，commit 時要原樣帶回。 }
                          uploadUrl: { type: string, format: uri }
                          expiresAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/upload/commit:
    post:
      tags: [後台・系統]
      operationId: commitUpload
      summary: 直傳完成後回報
      description: |
        伺服器讀檔頭驗真實型別（非圖片 → 400 `UPLOAD_TYPE` 並刪檔）、量大小（>10 MB →
        400 `UPLOAD_SIZE` 並刪檔），通過後搬到正式路徑（`yyyy/MM/{guid}{ext}`，不以內容雜湊命名、不去重）。
        回傳的圖片值就是內容欄位裡存的形狀，整包放進欄位、隨內容一起送。
      x-handler: UploadHandler.CommitAsync
      x-permission: upload.file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blobPath, originalFileName]
              properties:
                blobPath: { type: string }
                originalFileName: { type: string }
                alt: { type: [string, 'null'] }
      responses:
        '200':
          description: 圖片值。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UploadedImage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ═════════════════════════════════════════════════════════════════════
