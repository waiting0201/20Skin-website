      x-permission: home.arrange
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 七個版位。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/HomeSection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [後台・站台編排]
      operationId: updateHomeSections
      summary: 更新首頁版位
      description: |
        只列出要更新的版位即可；未知的 `sectionKey` → 400（七個版位是種子資料，不可新增刪除）。
        `settings` 須為合法 JSON 字串。引用的內容必須存在。已發布的首頁會回到草稿（前台仍顯示舊快照）。
        `doctors`／`clinics`／`specialties` 的項目名單前台不讀（自動列出整個單元），端點仍照收照存。
      x-handler: HomeSectionHandler.UpdateAsync
      x-permission: home.arrange
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HomeSectionUpdateRequest' }
      responses:
        '200':
          description: 更新後的七個版位。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/HomeSection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/menu:
    get:
      tags: [後台・站台編排]
      operationId: getMenu
      summary: 導覽選單與頁尾（編輯用）
      x-handler: MenuHandler.GetAsync
      x-permission: menu.edit
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 兩份選單樹。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MenuTree' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [後台・站台編排]
      operationId: updateMenu
      summary: 整份取代選單
      description: |
        `main`／`footer` 省略其中一個＝不動那份；兩個都省略 → 400。送出的那份選單整份取代。
        最多兩層；`autoChildren` 只能掛在頂層。`linkKind = 1` 以外的節點 `label` 不可為空。
        外部連結（`linkKind = 3`）強制新分頁並補 `rel`。引用的內容必須存在。
        儲存即生效，不走審核、不留痕。
      x-handler: MenuHandler.UpdateAsync
      x-permission: menu.edit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuTree' }
      responses:
        '200':
          description: 更新後的選單樹。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MenuTree' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/setting:
    get:
      tags: [後台・系統]
      operationId: getSettings
      summary: 全站設定（全部鍵值）
      x-handler: SettingHandler.GetAdminAsync
      x-permission: settings.edit
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 設定清單。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SiteSettingAdminItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [後台・系統]
      operationId: updateSettings
      summary: 更新全站設定
      description: |
        只更新呼叫端明確送上來的鍵；**只能更新既有的鍵**（未知鍵 → 404）。空字串視為「尚未設定」放行；
        其餘依該鍵的 `valueType` 驗證格式（Boolean／Number／Url／Json）。
        `tracking.ga4` 只收 GA4 評估 ID（`G-XXXX`）或 GTM 容器 ID（`GTM-XXXX`），多組逗號分隔，
        不收整段程式碼。儲存即生效，不走審核、不留痕。
      x-handler: SettingHandler.UpdateAsync
      x-permission: settings.edit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [settingKey]
                    properties:
                      settingKey: { type: string }
                      settingValue: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/OkMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/ai-index:
    get:
      tags: [後台・系統]
      operationId: getAiIndexStatus
      summary: AI 語料索引的唯讀狀態
      description: '沿用 `settings.edit`，不新增權限碼。回應標頭 `Cache-Control: no-store`。'
      x-handler: AiHandler.IndexStatusAsync
      x-permission: settings.edit
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 索引狀態。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [builtAt, chunkCount, indexedItemCount, ready]
                        properties:
                          builtAt:
                            type: [string, 'null']
                            format: date-time
                            description: 索引尚未就緒時為 null。
                          chunkCount: { type: integer }
                          indexedItemCount: { type: integer }
                          ready: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/export/{kind}:
    get:
      tags: [後台・系統]
      operationId: previewExport
      summary: 預覽 SEO／AI 匯出產物
      description: 只是預覽（每型別最多 20 筆等限制），正式產物走公開的 `/seo/*`。
      x-handler: ExportHandler.PreviewAsync
      x-permission: settings.edit
      security:
        - bearerAuth: []
