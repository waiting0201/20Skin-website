      x-handler: ContentHandler.ScheduleAsync
      x-permission: 'content.{unit}.publish'
      x-owner-check: 醫師角色只能動 OwnerUserId 是自己的內容。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleRequest' }
      responses:
        '200': { $ref: '#/components/responses/ContentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/{unit}/{id}/publish:
    patch:
      tags: [後台・內容單元]
      operationId: publishContent
      summary: 直接發布／下架
      description: |
        `publish`：快照目前的工作副本成新版本、設為已發布、重算站內搜尋用文字，並清掉上一版獨有的圖片。
        **不檢查來源狀態**，所以卡在舊「送審中」的內容按一次發布就救得回來。
        `unpublish`：只對已發布的內容有效，否則 409 `CONFLICT_STATE`。回傳完整詳情。
      x-handler: ContentHandler.PublishAsync
      x-permission: 'content.{unit}.publish'
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UnitPath'
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishRequest' }
      responses:
        '200': { $ref: '#/components/responses/ContentDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/{unit}/{id}/versions:
